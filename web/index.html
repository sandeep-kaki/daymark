<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151515">
  <meta name="description" content="A little clarity for your day. Plan, focus, and notice your progress with Daymark.">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./appearance.css">
  <title>Daymark — Make room for what matters</title>
</head>
<body>
  <div id="app"><main class="loading"><div class="brand-mark">d.</div><h1>A little clarity for your day.</h1><p>Opening your workspace…</p></main></div>
  <nav class="phone-tabs" aria-label="Destinations" hidden>
    <div class="phone-track"><span class="tab-lens" aria-hidden="true"><i></i></span></div>
  </nav>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <dialog id="plan-calendar" aria-label="Choose a planning day">
    <div class="calendar-top"><span>Plan for</span><button type="button" class="quiet" data-dismiss aria-label="Close calendar"></button></div>
    <div class="calendar-month"><h2 aria-live="polite"></h2><button type="button" class="quiet" data-month="-1" aria-label="Previous month"></button><button type="button" class="quiet" data-month="1" aria-label="Next month"></button></div>
    <div class="calendar-week" aria-hidden="true"><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span></div>
    <div class="calendar-days" role="group" aria-label="Days of the month"></div>
    <button type="button" class="calendar-today" data-today>Go to today</button>
  </dialog>
  <dialog id="navigation" aria-labelledby="navigation-title">
    <div class="line"><h2 id="navigation-title">Daymark</h2><button type="button" aria-label="Close navigation" autofocus>Close</button></div>
    <nav aria-label="Workspace"></nav>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Daymark needs JavaScript to save and display your plans on this device.</noscript>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
