name: Publish Daymark
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: daymark-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build && npm run check && npm test
        working-directory: web
        env:
          DAYMARK_FIREBASE_CONFIG: ${{ vars.DAYMARK_FIREBASE_CONFIG }}
          REQUIRE_CLOUD: '1'
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium --only-shell
      - name: Exercise the built app in a browser
        working-directory: web
        run: npm run test:browser
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Google workspace sync in Firebase emulators
        run: npx --yes firebase-tools@15.37.0 emulators:exec --only auth,firestore --project demo-daymark-sync "node web/tests/firebase-sync.cjs"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium --only-shell
        working-directory: web
      - name: Check the published URL in a clean browser
        working-directory: web
        env:
          DAYMARK_TEST_URL: ${{ steps.deployment.outputs.page_url }}
        run: npm run test:browser
